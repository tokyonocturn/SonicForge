name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Install Linux GUI toolchain
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Clippy (whole workspace, Windows)
        if: matrix.os == 'windows-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (whole workspace, Linux)
        # Same gate, minus `sf-cli`: the CLI drives Windows-only APO registration
        # and its platform layer is empty off Windows. Everything else — engine,
        # APO, editor, tray, installer — is linted here too.
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --exclude sf-cli -- -D warnings

      - name: Tests
        # Windows-only crates are built by the build step below; the portable
        # engine and platform layer are tested on both runners.
        run: cargo test -p sf-core -p sf-win --all-targets

      - name: Build workspace
        if: matrix.os == 'windows-latest'
        run: cargo build --workspace

      - name: APO self-test
        if: matrix.os == 'windows-latest'
        run: |
          cargo build -p sf-apo -p sf-cli
          ./target/debug/sonicforge.exe apo self-test

      - name: Render check
        if: matrix.os == 'windows-latest'
        run: |
          cargo run -p sf-cli -- presets list

  package:
    name: Package Windows binaries
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --workspace

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # Cargo names the CDylib after its lib target; pin the shipped name.
          Copy-Item target/release/sonicforge_apo.dll dist/SonicForgeAPO.dll
          Copy-Item target/release/sonicforge.exe dist/
          Copy-Item target/release/sonicforge-editor.exe dist/
          Copy-Item target/release/sonicforge-tray.exe dist/
          Copy-Item target/release/sf-setup.exe dist/
          Copy-Item LICENSE, NOTICE, README.md, CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath SonicForge-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SonicForge-windows-x64
          path: SonicForge-windows-x64.zip
          retention-days: 30
