[package]
name = "sf-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SonicForge audio engine: DSP, configuration compiler and processing pipeline"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Registry", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "sf_core"
path = "src/lib.rs"
